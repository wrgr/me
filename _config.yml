title: William Gray-Roncal, PhD
# Kept in step with the hero tagline in _data/cv/identity.yml, so the page's
# promise and its search snippet say the same thing.
description: >-
  Learning is the through-line — patterns in brains, in machines, and in minds.
  Giving everyone a chance to participate, and to thrive.
  Principal Research Engineer at the
  Johns Hopkins University Applied Physics Laboratory, working across
  connectomics, AI and data, defense and space, learning engineering, STEM
  workforce, and public health.
url: "https://will.grayroncal.com"
baseurl: ""

author:
  name: William Gray-Roncal
email: wgr@jhu.edu

permalink: pretty
timezone: America/New_York

plugins:
  - jekyll/scholar
  - jekyll-feed
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - cv
  - LICENSE
  # unified-theory build sources: only the generated index.html ships with the
  # site (served at /unified-theory/). The parts/ fragments must stay out of
  # _site — they cross-link anchors that only exist once concatenated, which
  # fails htmlproofer.
  - unified-theory/parts
  - unified-theory/figs
  - unified-theory/data
  - unified-theory/build.sh
  - unified-theory/design-plan.md
  - unified-theory/README.md

sass:
  style: compressed

scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: bib
  sort_by: year
  order: descending
  group_by: year
  group_order: descending
  bibtex_filters:
    - latex
    - smallcaps
    - superscript

defaults:
  - scope:
      path: ""
    values:
      layout: page
