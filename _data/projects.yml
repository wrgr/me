- name: Capability Matters casebook
  kind: Writing
  domains: [learning, workforce]
  blurb: >-
    205 field cases on building human capability — a 48-case main volume
    across seven domains. First Edition, August 2026.
  url: https://capabilitymatters.org/capability-matters-casebook-draft.pdf
  link_label: Casebook (PDF)

- name: Show Your Work
  kind: Writing — forthcoming
  domains: [learning]
  blurb: >-
