name: Build and deploy

# jekyll-scholar is not on the GitHub Pages whitelist, so the classic Pages
# builder cannot build this site — it must be built here and published as an
# artifact. Repo setting required once: Settings → Pages → Source →
# "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check links and HTML
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --no-enforce-https \
            --ignore-empty-alt \
            --allow-hash-href

      - name: Confirm the custom domain survived the build
        run: |
          # Jekyll copies CNAME from the repo root; without it in _site the
          # custom domain unbinds on deploy and the site 404s.
          test -f _site/CNAME || { echo "::error::_site/CNAME missing"; exit 1; }
          echo "CNAME: $(cat _site/CNAME)"

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'

  deploy:
    # Pull requests build and get checked, but only main publishes.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
