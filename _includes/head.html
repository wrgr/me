<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title and page.url != "/" %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {% feed_meta %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "William Gray-Roncal",
    "honorificSuffix": "PhD",
    "jobTitle": "Principal Research Engineer",
    "worksFor": {
      "@type": "Organization",
      "name": "Johns Hopkins University Applied Physics Laboratory"
    },
    "email": "mailto:{{ site.email }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "sameAs": [
      "https://github.com/{{ site.data.profiles.github }}",
      "https://scholar.google.com/citations?user={{ site.data.profiles.scholar }}",
      "https://www.linkedin.com/in/{{ site.data.profiles.linkedin }}/"
    ]
  }
  </script>
</head>
